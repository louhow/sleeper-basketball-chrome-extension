# Every push to main publishes a ready-to-load build as the "latest" release, so
# installing is: download sleeper-nba.zip, unzip, Load unpacked. No build tools needed.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run zip
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest .output/sleeper-nba.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Unzip sleeper-nba.zip, then in chrome://extensions turn on Developer mode, click Load unpacked and pick the unzipped folder."
